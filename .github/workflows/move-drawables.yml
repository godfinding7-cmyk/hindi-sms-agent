name: Move Drawable Files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move drawable files
        run: |
          set -e

          SRC="app/src/main/res/drawable/FILE_NAME.xml"
          DST="app/src/main/res/drawable"

          mv "$SRC"/* "$DST"/
          rmdir "$SRC"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Move drawable files to correct folder"
          git push
